workflows:
  build-xcframework:
    name: Build llama.xcframework (iOS Only)
    instance_type: mac_mini_m2

    scripts:

      # ---------------------------------------------------------
      # 1. Clone llama.cpp STQ_0 branch
      # ---------------------------------------------------------
      - name: Checkout STQ_0 branch
        script: |
          set -e

          git clone -b STQ_0 https://github.com/sjl623/llama.cpp.git

          cd llama.cpp

          echo "========================================"
          echo "llama.cpp commit:"
          git rev-parse HEAD
          echo "========================================"


      # ---------------------------------------------------------
      # 2. Force generic STQ1_0 kernel
      #
      # IMPORTANT:
      # We do NOT disable ARM NEON globally.
      #
      # Only STQ1_0 is redirected from:
      #
      #   ggml_vec_dot_stq1_0_q8_K
      #
      # to:
      #
      #   ggml_vec_dot_stq1_0_q8_K_generic
      #
      # This is specifically for testing STQ1_0 on Apple Silicon.
      # ---------------------------------------------------------
      - name: Force generic STQ1_0 kernel
        script: |
          set -e

          cd llama.cpp

          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("ggml/src/ggml-cpu/ggml-cpu.c"),
              Path("ggml/src/ggml-cpu/ggml-cpu.cpp"),
          ]

          target = None

          for p in candidates:
              if p.exists():
                  text = p.read_text()

                  if "ggml_vec_dot_stq1_0_q8_K" in text:
                      target = p
                      break

          if target is None:
              raise SystemExit(
                  "ERROR: Could not find STQ1_0 dispatch file"
              )

          text = target.read_text()

          print("========================================")
          print(f"Using dispatch file: {target}")
          print("========================================")

          old = "ggml_vec_dot_stq1_0_q8_K,"
          new = "ggml_vec_dot_stq1_0_q8_K_generic,"

          count = text.count(old)

          print(f"Found {count} STQ1_0 dispatch occurrence(s)")

          if count == 0:
              print("")
              print("Relevant STQ1_0 lines:")
              print("----------------------------------------")

              for line in text.splitlines():
                  if "stq1_0" in line.lower():
                      print(line)

              print("----------------------------------------")

              raise SystemExit(
                  "ERROR: STQ1_0 dispatch target not found"
              )

          # Replace only the first dispatch occurrence.
          text = text.replace(old, new, 1)

          target.write_text(text)

          # -----------------------------------------------------
          # Verification
          # -----------------------------------------------------

          patched = target.read_text()

          if new not in patched:
              raise SystemExit(
                  "ERROR: Patch verification failed"
              )

          print("")
          print("========================================")
          print("SUCCESS: STQ1_0 generic kernel enabled")
          print("========================================")

          for line in patched.splitlines():
              if "GGML_TYPE_STQ1_0" in line:
                  print(line)

              elif "ggml_vec_dot_stq1_0_q8_K_generic" in line:
                  print(line)

          print("========================================")
          PY


      # ---------------------------------------------------------
      # 3. Build llama.cpp for iOS arm64
      # ---------------------------------------------------------
      - name: Build iOS Device Only
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Configuring iOS arm64 build"
          echo "========================================"

          cmake -B build-ios-device \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_METAL=OFF \
            -DGGML_BLAS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          echo "========================================"
          echo "Building llama"
          echo "========================================"

          cmake --build build-ios-device \
            --config Release \
            --target llama \
            --parallel


      # ---------------------------------------------------------
      # 4. Locate static libraries
      # ---------------------------------------------------------
      - name: Locate Built Libraries
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Searching for libraries"
          echo "========================================"

          LLAMA_LIB=$(find build-ios-device \
            -name "libllama.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_LIB=$(find build-ios-device \
            -name "libggml.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_BASE_LIB=$(find build-ios-device \
            -name "libggml-base.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_CPU_LIB=$(find build-ios-device \
            -name "libggml-cpu.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          echo "LLAMA_LIB:"
          echo "$LLAMA_LIB"

          echo ""

          echo "GGML_LIB:"
          echo "$GGML_LIB"

          echo ""

          echo "GGML_BASE_LIB:"
          echo "$GGML_BASE_LIB"

          echo ""

          echo "GGML_CPU_LIB:"
          echo "$GGML_CPU_LIB"

          echo ""

          # Fail explicitly if something wasn't found.

          test -n "$LLAMA_LIB" || {
            echo "ERROR: libllama.a not found"
            exit 1
          }

          test -n "$GGML_LIB" || {
            echo "ERROR: libggml.a not found"
            exit 1
          }

          test -n "$GGML_BASE_LIB" || {
            echo "ERROR: libggml-base.a not found"
            exit 1
          }

          test -n "$GGML_CPU_LIB" || {
            echo "ERROR: libggml-cpu.a not found"
            exit 1
          }


      # ---------------------------------------------------------
      # 5. Combine static libraries
      # ---------------------------------------------------------
      - name: Combine Static Libraries
        script: |
          set -e

          cd llama.cpp

          mkdir -p build-ios-device/combined

          LLAMA_LIB=$(find build-ios-device \
            -name "libllama.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_LIB=$(find build-ios-device \
            -name "libggml.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_BASE_LIB=$(find build-ios-device \
            -name "libggml-base.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_CPU_LIB=$(find build-ios-device \
            -name "libggml-cpu.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          echo "========================================"
          echo "Combining static libraries"
          echo "========================================"

          libtool -static \
            -o build-ios-device/combined/libllama_combined.a \
            "$LLAMA_LIB" \
            "$GGML_LIB" \
            "$GGML_BASE_LIB" \
            "$GGML_CPU_LIB"

          echo "Combined library created:"
          ls -lh build-ios-device/combined/libllama_combined.a


      # ---------------------------------------------------------
      # 6. Prepare headers
      # ---------------------------------------------------------
      - name: Prepare Headers
        script: |
          set -e

          cd llama.cpp

          mkdir -p build-apple/merged-headers

          echo "========================================"
          echo "Copying llama headers"
          echo "========================================"

          cp include/*.h \
            build-apple/merged-headers/

          echo "========================================"
          echo "Copying ggml headers"
          echo "========================================"

          cp ggml/include/*.h \
            build-apple/merged-headers/


      # ---------------------------------------------------------
      # 7. Create module map
      # ---------------------------------------------------------
      - name: Create Module Map
        script: |
          set -e

          cd llama.cpp

          cat > build-apple/merged-headers/module.modulemap <<'EOF'
          module llama {
              header "llama.h"
              export *
          }
          EOF

          echo "========================================"
          echo "module.modulemap:"
          echo "========================================"

          cat build-apple/merged-headers/module.modulemap


      # ---------------------------------------------------------
      # 8. Create XCFramework
      # ---------------------------------------------------------
      - name: Create XCFramework
        script: |
          set -e

          cd llama.cpp

          mkdir -p build-apple

          echo "========================================"
          echo "Creating llama.xcframework"
          echo "========================================"

          xcodebuild -create-xcframework \
            -library build-ios-device/combined/libllama_combined.a \
            -headers build-apple/merged-headers \
            -output build-apple/llama.xcframework

          echo "========================================"
          echo "XCFramework created"
          echo "========================================"

          ls -lah build-apple/llama.xcframework


    # -----------------------------------------------------------
    # Artifacts
    # -----------------------------------------------------------
    artifacts:
      - llama.cpp/build-apple/llama.xcframework
