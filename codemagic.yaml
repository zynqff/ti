workflows:
  ios-swift-build:
    name: iOS Application Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Unsigned iOS IPA
        script: |
          set -e

          XCODEPROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          echo "Найден проект: $XCODEPROJECT"

          # 1. Загружаем зависимости Swift Package Manager (если они есть)
          xcodebuild -resolvePackageDependencies -project "$XCODEPROJECT" || true

          # 2. Создаем полноценный архив приложения (.xcarchive)
          xcodebuild archive \
            -project "$XCODEPROJECT" \
            -scheme "VibeTalkAudioLab" \
            -sdk iphoneos \
            -archivePath "./build/VibeTalkAudioLab.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION="5.0"

          # 3. Путь к скомпилированному .app внутри архива
          APP_PATH=$(find ./build/VibeTalkAudioLab.xcarchive -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ Ошибка: Приложение .app не найдено внутри .xcarchive!"
            exit 1
          fi

          echo "✅ Найдено приложение: $APP_PATH"

          # 4. Формируем правильно упакованный .ipa
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build/ios/ipa
          zip -r build/ios/ipa/VibeTalkAudioLab.ipa Payload

          echo "🎉 Размер итогового .ipa:"
          ls -lh build/ios/ipa/VibeTalkAudioLab.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - zynqff@gmail.com
        notify:
          success: true
          failure: true
