workflows:
  ios-swift-build:
    name: iOS Application Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Unsigned iOS IPA
        script: |
          set -e

          # 1. Синхронизируем структуру файлов проекта
          if [ -d "VibeTalkAudioLab" ]; then
            echo "📁 Переносим исходники и ресурсы в корень..."
            cp -R VibeTalkAudioLab/* . 2>/dev/null || true
          fi

          # 2. Очищаем прошлые сборки и кэш
          rm -rf build Payload DerivedData

          # 3. Разрешаем зависимости Swift Package Manager (если есть)
          xcodebuild -resolvePackageDependencies \
            -project "VibeTalkAudioLab.xcodeproj" \
            -clonedSourcePackagesDirPath ./DerivedData/SourcePackages || true

          # 4. Собираем архив с отключенной функцией Explicit Module Build (предотвращает краш SwiftDriver)
          xcodebuild archive \
            -project "VibeTalkAudioLab.xcodeproj" \
            -scheme "VibeTalkAudioLab" \
            -destination 'generic/platform=iOS' \
            -archivePath "./build/VibeTalkAudioLab.xcarchive" \
            -derivedDataPath "./DerivedData" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_ENABLE_EXPLICIT_MODULE_BUILD=NO \
            PRODUCT_NAME="VibeTalkAudioLab"

          # 5. Проверяем скомпилированный .app
          APP_PATH=$(find ./build/VibeTalkAudioLab.xcarchive -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ Ошибка: .app не найден!"
            exit 1
          fi

          echo "✅ Найдено приложение: $APP_PATH"

          # 6. Упаковываем в .ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build/ios/ipa
          zip -r build/ios/ipa/VibeTalkAudioLab.ipa Payload

          echo "🎉 Сборка успешно завершена!"
          ls -lh build/ios/ipa/VibeTalkAudioLab.ipa
    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - zynqff@gmail.com
        notify:
          success: true
          failure: true
