workflows:

  build-xcframework:
    name: Build llama.xcframework (iOS arm64 + Metal)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:

      # =========================================================
      # 1. Checkout exact working llama.cpp revision
      # =========================================================
      - name: Checkout llama.cpp Q2_0C
        script: |
          set -e

          echo "========================================"
          echo "Checkout llama.cpp PR #19357"
          echo "========================================"

          git clone https://github.com/ggml-org/llama.cpp.git llama.cpp

          cd llama.cpp

          echo "Fetching PR #19357..."
          git fetch origin pull/19357/head

          echo "Checking out tested commit..."
          git checkout 2af64dd00a6689a7bfaf69b4768a944d0ec6bade

          EXPECTED="2af64dd00a6689a7bfaf69b4768a944d0ec6bade"
          ACTUAL="$(git rev-parse HEAD)"

          echo ""
          echo "Expected:"
          echo "$EXPECTED"

          echo "Actual:"
          echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Wrong llama.cpp commit!"
            exit 1
          fi

          echo ""
          echo "Last commit:"
          git log -1 --oneline

          echo ""
          echo "========================================"
          echo "Q2_0C verification"
          echo "========================================"

          echo ""
          echo "GGML_TYPE_Q2_0C:"
          git grep -in "GGML_TYPE_Q2_0C" -- \
            ggml/include ggml/src

          echo ""
          echo "QKQ2_0C:"
          git grep -in "QKQ2_0C" -- \
            ggml/src

          echo ""
          echo "block_q2_0c:"
          git grep -in "block_q2_0c" -- \
            ggml/src

          echo ""
          echo "========================================"
          echo "Q2_0C runtime verified"
          echo "========================================"


      # =========================================================
      # 2. Configure iOS arm64 + Metal
      # =========================================================
      - name: Configure iOS arm64 Metal
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Configuring llama.cpp"
          echo "========================================"
          echo "Platform: iOS"
          echo "SDK: iphoneos"
          echo "Architecture: arm64"
          echo "Metal: ON"
          echo "Deployment target: iOS 16.0"
          echo "========================================"

          rm -rf build-ios-device

          cmake -B build-ios-device \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_TARGET_OS=ios \
            -DGGML_BLAS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF

          echo ""
          echo "========================================"
          echo "CMake configuration complete"
          echo "========================================"


      # =========================================================
      # 3. Build ONLY llama library
      # =========================================================
      - name: Build iOS Device
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Building llama target"
          echo "========================================"
          echo "Target: iOS arm64"
          echo "Backend: Metal"
          echo "Configuration: Release"
          echo "========================================"

          cmake --build build-ios-device \
            --config Release \
            --parallel \
            --target llama

          echo ""
          echo "========================================"
          echo "llama target built successfully"
          echo "========================================"

          echo ""
          echo "Static libraries:"
          find build-ios-device \
            -name "*.a" \
            -path "*Release-iphoneos*" \
            -print \
            | sort


      # =========================================================
      # 4. Locate all required libraries
      # =========================================================
      - name: Locate Libraries
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Locating libraries"
          echo "========================================"

          LLAMA_LIB=$(find build-ios-device \
            -name "libllama.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_LIB=$(find build-ios-device \
            -name "libggml.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_BASE_LIB=$(find build-ios-device \
            -name "libggml-base.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_CPU_LIB=$(find build-ios-device \
            -name "libggml-cpu.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_METAL_LIB=$(find build-ios-device \
            -name "libggml-metal.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          echo ""
          echo "libllama.a:"
          echo "$LLAMA_LIB"

          echo ""
          echo "libggml.a:"
          echo "$GGML_LIB"

          echo ""
          echo "libggml-base.a:"
          echo "$GGML_BASE_LIB"

          echo ""
          echo "libggml-cpu.a:"
          echo "$GGML_CPU_LIB"

          echo ""
          echo "libggml-metal.a:"
          echo "$GGML_METAL_LIB"

          echo ""

          test -n "$LLAMA_LIB" || {
            echo "ERROR: libllama.a not found"
            exit 1
          }

          test -n "$GGML_LIB" || {
            echo "ERROR: libggml.a not found"
            exit 1
          }

          test -n "$GGML_BASE_LIB" || {
            echo "ERROR: libggml-base.a not found"
            exit 1
          }

          test -n "$GGML_CPU_LIB" || {
            echo "ERROR: libggml-cpu.a not found"
            exit 1
          }

          test -n "$GGML_METAL_LIB" || {
            echo "ERROR: libggml-metal.a not found"
            exit 1
          }

          echo ""
          echo "========================================"
          echo "All required libraries found"
          echo "========================================"


      # =========================================================
      # 5. Combine libraries
      # =========================================================
      - name: Combine Static Libraries
        script: |
          set -e

          cd llama.cpp

          mkdir -p build-ios-device/combined

          LLAMA_LIB=$(find build-ios-device \
            -name "libllama.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_LIB=$(find build-ios-device \
            -name "libggml.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_BASE_LIB=$(find build-ios-device \
            -name "libggml-base.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_CPU_LIB=$(find build-ios-device \
            -name "libggml-cpu.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_METAL_LIB=$(find build-ios-device \
            -name "libggml-metal.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          echo "========================================"
          echo "Combining static libraries"
          echo "========================================"

          libtool -static \
            -o build-ios-device/combined/libllama_combined.a \
            "$LLAMA_LIB" \
            "$GGML_LIB" \
            "$GGML_BASE_LIB" \
            "$GGML_CPU_LIB" \
            "$GGML_METAL_LIB"

          echo ""
          echo "Combined library:"
          ls -lh build-ios-device/combined/libllama_combined.a

          echo ""
          echo "Architecture:"
          lipo -info build-ios-device/combined/libllama_combined.a

          echo ""
          echo "========================================"
          echo "Libraries combined successfully"
          echo "========================================"


      # =========================================================
      # 6. Prepare headers
      # =========================================================
      - name: Prepare Headers
        script: |
          set -e

          cd llama.cpp

          rm -rf build-apple/merged-headers
          mkdir -p build-apple/merged-headers

          echo "========================================"
          echo "Preparing headers"
          echo "========================================"

          cp include/*.h \
            build-apple/merged-headers/

          cp ggml/include/*.h \
            build-apple/merged-headers/

          find build-apple/merged-headers \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "Headers prepared."


      # =========================================================
      # 7. Module map
      # =========================================================
      - name: Create Module Map
        script: |
          set -e

          cd llama.cpp

          cat > build-apple/merged-headers/module.modulemap <<'EOF'
          module llama {
              header "llama.h"
              export *
          }
          EOF

          echo "========================================"
          echo "Module map"
          echo "========================================"

          cat build-apple/merged-headers/module.modulemap


      # =========================================================
      # 8. Create XCFramework
      # =========================================================
      - name: Create XCFramework
        script: |
          set -e

          cd llama.cpp

          rm -rf build-apple/llama.xcframework
          mkdir -p build-apple

          echo "========================================"
          echo "Creating llama.xcframework"
          echo "========================================"

          xcodebuild -create-xcframework \
            -library build-ios-device/combined/libllama_combined.a \
            -headers build-apple/merged-headers \
            -output build-apple/llama.xcframework

          echo ""
          echo "========================================"
          echo "XCFramework created"
          echo "========================================"

          find build-apple/llama.xcframework \
            -maxdepth 4 \
            -type f \
            | sort


      # =========================================================
      # 9. Verify final XCFramework
      # =========================================================
      - name: Verify XCFramework
        script: |
          set -e

          cd llama.cpp

          FRAMEWORK="build-apple/llama.xcframework/ios-arm64"
          BINARY="$FRAMEWORK/llama.framework/llama"

          echo "========================================"
          echo "Final XCFramework verification"
          echo "========================================"

          test -d "$FRAMEWORK" || {
            echo "ERROR: ios-arm64 slice not found"
            exit 1
          }

          test -d "$FRAMEWORK/llama.framework" || {
            echo "ERROR: llama.framework not found"
            exit 1
          }

          test -f "$BINARY" || {
            echo "ERROR: llama binary not found"
            exit 1
          }

          echo ""
          echo "iOS arm64:       OK"
          echo "llama.framework: OK"
          echo "Binary:           OK"
          echo "Metal:            ENABLED"
          echo "SDK:              iphoneos"
          echo "Architecture:     arm64"
          echo "Quantization:     Q2_0C / INT2"
          echo "PR:               #19357"
          echo "Commit:           2af64dd00a6689a7bfaf69b4768a944d0ec6bade"

          echo ""
          echo "Binary information:"
          file "$BINARY"

          echo ""
          echo "Architecture information:"
          lipo -info "$BINARY"

          echo ""
          echo "========================================"
          echo "SUCCESS"
          echo "========================================"


    artifacts:
      - llama.cpp/build-apple/llama.xcframework
