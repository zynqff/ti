workflows:
  ios-swift-build:
    name: iOS Application Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Unsigned iOS IPA
        script: |
          set -e

          # 1. Находим файл проекта и переходим прямо в его папку
          XCODEPROJECT_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$XCODEPROJECT_PATH")
          XCODEPROJECT=$(basename "$XCODEPROJECT_PATH")

          echo "📁 Переходим в папку проекта: $PROJECT_DIR"
          echo "📦 Файл проекта: $XCODEPROJECT"

          cd "$PROJECT_DIR"

          # 2. Загружаем зависимости Swift Package Manager (если есть)
          xcodebuild -resolvePackageDependencies -project "$XCODEPROJECT" || true

          # 3. Создаем архив приложения (.xcarchive)
          xcodebuild archive \
            -project "$XCODEPROJECT" \
            -scheme "VibeTalkAudioLab" \
            -destination 'generic/platform=iOS' \
            -archivePath "./build/VibeTalkAudioLab.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION="5.0" \
            PRODUCT_NAME="VibeTalkAudioLab"

          # 4. Находим скомпилированное приложение داخل архива
          APP_PATH=$(find ./build/VibeTalkAudioLab.xcarchive -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ Ошибка: Приложение .app не найдено внутри .xcarchive!"
            exit 1
          fi

          echo "✅ Найдено приложение: $APP_PATH"

          # 5. Упаковываем в .ipa
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build/ios/ipa
          zip -r build/ios/ipa/VibeTalkAudioLab.ipa Payload

          echo "🎉 Сборка завершена! Размер получившегося .ipa:"
          ls -lh build/ios/ipa/VibeTalkAudioLab.ipa
    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - zynqff@gmail.com
        notify:
          success: true
          failure: true
