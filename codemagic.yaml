workflows:

  build-xcframework:
    name: Build llama.xcframework (iOS arm64 + Metal)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:

      # =========================================================
      # 1. Checkout llama.cpp PR #19357
      #    Exact commit used by the working Windows Q2_0C build
      # =========================================================
      - name: Checkout llama.cpp PR #19357
        script: |
          set -e

          echo "========================================"
          echo "Checkout llama.cpp PR #19357"
          echo "========================================"

          git clone https://github.com/ggml-org/llama.cpp.git llama.cpp

          cd llama.cpp

          echo ""
          echo "Fetching PR #19357..."
          git fetch origin pull/19357/head:pr-19357-sme2-int2

          git checkout pr-19357-sme2-int2

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git rev-parse HEAD

          echo ""
          echo "Last commit:"
          git log -1 --oneline

          EXPECTED_COMMIT="2af64dd00a6689a7bfaf69b4768a944d0ec6bade"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo ""
          echo "Expected commit:"
          echo "$EXPECTED_COMMIT"

          echo "Actual commit:"
          echo "$ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo ""
            echo "ERROR: Wrong llama.cpp commit!"
            echo "The build must use the exact Q2_0C runtime tested on Windows."
            exit 1
          fi

          echo ""
          echo "SUCCESS: Correct PR #19357 commit selected."
          echo "========================================"


      # =========================================================
      # 2. Verify Q2_0C / INT2 implementation
      # =========================================================
      - name: Verify Q2_0C support
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Verifying Q2_0C / INT2 support"
          echo "========================================"

          echo ""
          echo "Searching for Q2_0C symbols..."

          Q2_COUNT=$(grep -R "Q2_0c" ggml src include 2>/dev/null | wc -l | tr -d ' ' || true)

          echo "Q2_0c references found: $Q2_COUNT"

          if [ "$Q2_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: Q2_0c implementation was not found!"
            exit 1
          fi

          echo ""
          echo "Example Q2_0c references:"
          grep -R "Q2_0c" ggml src include 2>/dev/null | head -n 30 || true

          echo ""
          echo "Checking INT2-related files..."

          find ggml -type f \
            \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) \
            -print0 2>/dev/null \
            | xargs -0 grep -l "Q2_0c" 2>/dev/null \
            | head -n 30 || true

          echo ""
          echo "========================================"
          echo "Q2_0C implementation detected"
          echo "========================================"


      # =========================================================
      # 3. Configure iOS arm64 + Metal
      # =========================================================
      - name: Configure iOS arm64 Metal
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Configuring llama.cpp"
          echo "========================================"
          echo "Platform: iOS"
          echo "SDK: iphoneos"
          echo "Architecture: arm64"
          echo "GPU backend: Metal"
          echo "Deployment target: iOS 16.0"
          echo "========================================"

          rm -rf build-ios-device

          cmake -B build-ios-device \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_TARGET_OS=ios \
            -DGGML_BLAS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF

          echo ""
          echo "========================================"
          echo "CMake configuration complete"
          echo "========================================"


      # =========================================================
      # 4. Build llama.cpp + ggml + Metal
      # =========================================================
      - name: Build iOS Device
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Building llama.cpp"
          echo "========================================"
          echo "Target: iOS arm64"
          echo "Backend: Metal"
          echo "Configuration: Release"
          echo "========================================"

          cmake --build build-ios-device \
            --config Release \
            --parallel

          echo ""
          echo "========================================"
          echo "Build completed"
          echo "========================================"


      # =========================================================
      # 5. Locate required static libraries
      # =========================================================
      - name: Locate Libraries
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Searching for iOS static libraries"
          echo "========================================"

          find build-ios-device \
            -name "*.a" \
            -path "*Release-iphoneos*" \
            -print \
            | sort

          echo ""
          echo "========================================"

          LLAMA_LIB=$(find build-ios-device \
            -name "libllama.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_LIB=$(find build-ios-device \
            -name "libggml.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_BASE_LIB=$(find build-ios-device \
            -name "libggml-base.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_CPU_LIB=$(find build-ios-device \
            -name "libggml-cpu.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_METAL_LIB=$(find build-ios-device \
            -name "libggml-metal.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          echo "libllama.a:"
          echo "$LLAMA_LIB"

          echo ""
          echo "libggml.a:"
          echo "$GGML_LIB"

          echo ""
          echo "libggml-base.a:"
          echo "$GGML_BASE_LIB"

          echo ""
          echo "libggml-cpu.a:"
          echo "$GGML_CPU_LIB"

          echo ""
          echo "libggml-metal.a:"
          echo "$GGML_METAL_LIB"

          echo ""

          test -n "$LLAMA_LIB" || {
            echo "ERROR: libllama.a not found"
            exit 1
          }

          test -n "$GGML_LIB" || {
            echo "ERROR: libggml.a not found"
            exit 1
          }

          test -n "$GGML_BASE_LIB" || {
            echo "ERROR: libggml-base.a not found"
            exit 1
          }

          test -n "$GGML_CPU_LIB" || {
            echo "ERROR: libggml-cpu.a not found"
            exit 1
          }

          test -n "$GGML_METAL_LIB" || {
            echo "ERROR: libggml-metal.a not found"
            exit 1
          }

          echo "========================================"
          echo "All required libraries found"
          echo "========================================"


      # =========================================================
      # 6. Combine static libraries
      # =========================================================
      - name: Combine Static Libraries
        script: |
          set -e

          cd llama.cpp

          mkdir -p build-ios-device/combined

          LLAMA_LIB=$(find build-ios-device \
            -name "libllama.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_LIB=$(find build-ios-device \
            -name "libggml.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_BASE_LIB=$(find build-ios-device \
            -name "libggml-base.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_CPU_LIB=$(find build-ios-device \
            -name "libggml-cpu.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          GGML_METAL_LIB=$(find build-ios-device \
            -name "libggml-metal.a" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          echo "========================================"
          echo "Combining static libraries"
          echo "========================================"

          libtool -static \
            -o build-ios-device/combined/libllama_combined.a \
            "$LLAMA_LIB" \
            "$GGML_LIB" \
            "$GGML_BASE_LIB" \
            "$GGML_CPU_LIB" \
            "$GGML_METAL_LIB"

          echo ""
          echo "Combined library:"
          ls -lh build-ios-device/combined/libllama_combined.a

          echo ""
          echo "Architecture:"
          lipo -info build-ios-device/combined/libllama_combined.a

          echo ""
          echo "========================================"
          echo "Static libraries combined"
          echo "========================================"


      # =========================================================
      # 7. Prepare public headers
      # =========================================================
      - name: Prepare Headers
        script: |
          set -e

          cd llama.cpp

          rm -rf build-apple/merged-headers
          mkdir -p build-apple/merged-headers

          echo "========================================"
          echo "Preparing public headers"
          echo "========================================"

          cp include/*.h \
            build-apple/merged-headers/

          cp ggml/include/*.h \
            build-apple/merged-headers/

          echo ""
          echo "Headers:"
          find build-apple/merged-headers \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"


      # =========================================================
      # 8. Create module map
      # =========================================================
      - name: Create Module Map
        script: |
          set -e

          cd llama.cpp

          cat > build-apple/merged-headers/module.modulemap <<'EOF'
          module llama {
              header "llama.h"
              export *
          }
          EOF

          echo "========================================"
          echo "module.modulemap"
          echo "========================================"

          cat build-apple/merged-headers/module.modulemap

          echo "========================================"


      # =========================================================
      # 9. Create XCFramework
      # =========================================================
      - name: Create XCFramework
        script: |
          set -e

          cd llama.cpp

          rm -rf build-apple/llama.xcframework
          mkdir -p build-apple

          echo "========================================"
          echo "Creating llama.xcframework"
          echo "========================================"

          xcodebuild -create-xcframework \
            -library build-ios-device/combined/libllama_combined.a \
            -headers build-apple/merged-headers \
            -output build-apple/llama.xcframework

          echo ""
          echo "========================================"
          echo "XCFramework created"
          echo "========================================"

          find build-apple/llama.xcframework \
            -maxdepth 4 \
            -type f \
            | sort


      # =========================================================
      # 10. Verify XCFramework
      # =========================================================
      - name: Verify XCFramework
        script: |
          set -e

          cd llama.cpp

          FRAMEWORK="build-apple/llama.xcframework/ios-arm64"
          BINARY="$FRAMEWORK/llama.framework/llama"

          echo "========================================"
          echo "Final XCFramework verification"
          echo "========================================"

          test -d "$FRAMEWORK" || {
            echo "ERROR: ios-arm64 slice not found"
            exit 1
          }

          test -d "$FRAMEWORK/llama.framework" || {
            echo "ERROR: llama.framework not found"
            exit 1
          }

          test -f "$BINARY" || {
            echo "ERROR: llama.framework binary not found"
            exit 1
          }

          echo "iOS arm64 slice:      OK"
          echo "llama.framework:      OK"
          echo "Binary:               OK"
          echo "Metal:                ENABLED"
          echo "Target SDK:           iphoneos"
          echo "Architecture:         arm64"
          echo "Quantization:         Q2_0C / INT2"
          echo "Runtime:              llama.cpp PR #19357"
          echo "Commit:               2af64dd00a6689a7bfaf69b4768a944d0ec6bade"

          echo ""
          echo "Binary information:"
          file "$BINARY"

          echo ""
          echo "Architecture information:"
          lipo -info "$BINARY"

          echo ""
          echo "========================================"
          echo "SUCCESS"
          echo "========================================"
          echo "Ready for LocalTranslator."


    artifacts:
      - llama.cpp/build-apple/llama.xcframework
