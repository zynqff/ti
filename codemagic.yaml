workflows:
  ios-unsigned-ipa:
    name: VibeTalk Audio Lab - unsigned IPA (RNNoise + DTLN2 + DFNet3)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify models and prepare RNNoise
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          chmod +x Scripts/prepare_native.sh
          ./Scripts/prepare_native.sh

      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          echo "🧹 Очищаем прошлые кэши..."
          rm -rf DerivedData ~/Library/Caches/org.swift.swiftpm

          echo "📦 Принудительно качаем ONNX Runtime строго под iOS..."
          xcodebuild -resolvePackageDependencies \
            -project VibeTalkAudioLab.xcodeproj \
            -scheme VibeTalkAudioLab \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages" \
            SDKROOT=iphoneos \
            -scmProvider system

      - name: Build unsigned iOS device app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          rm -rf build_unsigned
          mkdir -p build_unsigned

          echo "🔨 Начинаем сборку архива..."
          xcodebuild archive \
            -project VibeTalkAudioLab.xcodeproj \
            -scheme VibeTalkAudioLab \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build_unsigned/VibeTalkAudioLab.xcarchive" \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages" \
            -configuration Release \
            SDKROOT=iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            SWIFT_VERSION=5.0 \
            PRODUCT_NAME="VibeTalkAudioLab" \
            PRODUCT_BUNDLE_IDENTIFIER="com.vibetalk.audiolab" \
            GENERATE_INFOPLIST_FILE=YES \
            INFOPLIST_KEY_NSMicrophoneUsageDescription="Приложению требуется доступ к микрофону для работы со звуком." \
            INFOPLIST_KEY_UILaunchScreen_Generation=YES \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Package unsigned IPA container
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          APP=$(find "$CM_BUILD_DIR/build_unsigned/VibeTalkAudioLab.xcarchive" -name "*.app" | head -n 1)
          test -d "$APP"

          rm -rf "$CM_BUILD_DIR/build_unsigned/Payload"
          mkdir -p "$CM_BUILD_DIR/build_unsigned/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build_unsigned/Payload/"

          cd "$CM_BUILD_DIR/build_unsigned"
          /usr/bin/zip -qry VibeTalkAudioLab-unsigned.ipa Payload

      - name: Diagnostics
        script: |
          cd "$CM_BUILD_DIR"
          xcodebuild -version || true
          ls -lh build_unsigned/VibeTalkAudioLab-unsigned.ipa

    artifacts:
      - build_unsigned/VibeTalkAudioLab-unsigned.ipa
      - build_unsigned/VibeTalkAudioLab.xcarchive
      - /tmp/xcodebuild_logs/*.log


scripts:

  - name: Fix Xcode source paths
    script: |
      set -e
      PROJECT="VibeTalkAudioLab.xcodeproj/project.pbxproj"

      echo "=== Fixing Swift source paths in Xcode project ==="

      python3 <<'PY'
      from pathlib import Path
      import re

      project = Path("VibeTalkAudioLab.xcodeproj/project.pbxproj")
      text = project.read_text()

      files = [
          "App.swift",
          "ContentView.swift",
          "AudioManager.swift",
          "AudioProcessor.swift",
          "BenchmarkManager.swift",
          "ResultsView.swift",
          "BlindTestView.swift",
          "ContinuousStreamTest.swift",
          "AudioUtils.swift",
          "DTLNProcessor.swift",
      ]

      # Fix PBXFileReference/PBXBuildFile path entries when they point
      # to the repository root. Existing files remain in VibeTalkAudioLab/.
      for name in files:
          text = re.sub(
              rf'(?m)^(\s*path\s*=\s*){re.escape(name)}(\s*;)',
              rf'\1VibeTalkAudioLab/{name}\2',
              text
          )

      project.write_text(text)
      PY

      echo "=== Verifying source files ==="
      for FILE in \
        App.swift \
        ContentView.swift \
        AudioManager.swift \
        AudioProcessor.swift \
        BenchmarkManager.swift \
        ResultsView.swift \
        BlindTestView.swift \
        ContinuousStreamTest.swift \
        AudioUtils.swift \
        DTLNProcessor.swift
      do
        test -f "VibeTalkAudioLab/$FILE" || {
          echo "ERROR: missing VibeTalkAudioLab/$FILE"
          exit 1
        }
      done

      echo "Source paths fixed successfully."
