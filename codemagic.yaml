workflows:
  build-app-unsigned-ipa:
    name: Build LocalTranslator + native Q2_0C Metal
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Fetch llama.cpp PR #19357 and apply native Q2_0C Metal patch
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          rm -rf "$ROOT/.build/llama.cpp"
          mkdir -p "$ROOT/.build"
          git clone --filter=blob:none https://github.com/chaxu01/llama.cpp.git "$ROOT/.build/llama.cpp"
          cd "$ROOT/.build/llama.cpp"
          git checkout --detach 92c448af6
          python3 - "$ROOT/.build/llama.cpp" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          # Reuse the checked-in patcher. It is deliberately version-locked.
          patcher = root.parent.parent / 'Scripts' / 'patch_q2_0c_metal.sh'
          if not patcher.exists():
              raise SystemExit(f'Missing patcher: {patcher}')
          PY
          "$ROOT/Scripts/patch_q2_0c_metal.sh"
      - name: Build llama.cpp iOS XCFramework with embedded Metal
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/.build/llama.cpp"
          cmake -S . -B build-apple \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_TARGET_OS=ios \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF
          cmake --build build-apple --config Release --target llama -j2
          test -f build-apple/llama.xcframework/ios-arm64/libllama.a || true
          find build-apple -name 'libllama*.a' -o -name '*metallib*' | sort
      - name: Install generated XCFramework
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          XCFW="$ROOT/.build/llama.cpp/build-apple/llama.xcframework"
          test -d "$XCFW"
          rm -rf "$ROOT/Vendor/llama.xcframework"
          mkdir -p "$ROOT/Vendor"
          cp -R "$XCFW" "$ROOT/Vendor/llama.xcframework"
      - name: Verify Q2_0C Metal source and generated framework
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          SRC="$ROOT/.build/llama.cpp/ggml/src/ggml-metal/ggml-metal.metal"
          XCFW="$ROOT/Vendor/llama.xcframework"
          grep -q 'kernel_mul_mv_q2_0c_f32' "$SRC"
          grep -q 'GGML_TYPE_Q2_0C' "$ROOT/.build/llama.cpp/ggml/src/ggml-metal/ggml-metal-ops.cpp"
          test -f "$XCFW/ios-arm64/Headers/llama.h"
          echo 'Native Q2_0C Metal source is present and XCFramework was generated.'
      - name: Build LocalTranslator.app unsigned
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          BUILD_DIR="$ROOT/build/Release-iphoneos"
          XCFW="$ROOT/Vendor/llama.xcframework"
          LIB_DIR="$XCFW/ios-arm64"
          HDRS="$LIB_DIR/Headers"
          MODMAP="$HDRS/module.modulemap"
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
          xcodebuild build \
            -project "$ROOT/LocalTranslator.xcodeproj" \
            -target LocalTranslator \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            HEADER_SEARCH_PATHS="$HDRS" \
            LIBRARY_SEARCH_PATHS="$LIB_DIR" \
            OTHER_SWIFT_FLAGS="-Xcc -fmodule-map-file=$MODMAP -Xcc -I$HDRS" \
            OTHER_LDFLAGS="-lllama -lc++ -framework Accelerate"
          test -d "$BUILD_DIR/LocalTranslator.app"
          echo "APP_PATH=$BUILD_DIR/LocalTranslator.app" >> "$CM_ENV"
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          OUT="$ROOT/build"
          rm -rf "$OUT/Payload" && mkdir -p "$OUT/Payload"
          cp -R "$APP_PATH" "$OUT/Payload/LocalTranslator.app"
          cd "$OUT"
          zip -r -y LocalTranslator-unsigned.ipa Payload >/dev/null
    artifacts:
      - build/LocalTranslator-unsigned.ipa
      - Vendor/llama.xcframework
