workflows:
  ios-swift-build:
    name: iOS Application Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build iOS IPA
        script: |
          # Автоматически находим .xcworkspace или .xcodeproj в репозитории
          XCWORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          XCODEPROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -n "$XCWORKSPACE" ]; then
            echo "Найден Workspace: $XCWORKSPACE"
            xcode-project build-ipa --workspace "$XCWORKSPACE" --scheme "VibeTalkAudioLab"
          elif [ -n "$XCODEPROJECT" ]; then
            echo "Найден Project: $XCODEPROJECT"
            xcode-project build-ipa --project "$XCODEPROJECT" --scheme "VibeTalkAudioLab"
          else
            echo "❌ Ошибка: Файлы .xcodeproj или .xcworkspace не найдены в репозитории!"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - zynqff@gmail.com
        notify:
          success: true
          failure: true
