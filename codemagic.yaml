workflows:
  build-xcframework:
    name: Build llama.xcframework (iOS Only)
    instance_type: mac_mini_m2
    scripts:
      - name: Checkout STQ_0 branch
        script: |
          git clone -b STQ_0 https://github.com/sjl623/llama.cpp.git
      - name: Build iOS Device Only
        script: |
          set -e
          cd llama.cpp

          # 1. Конфигурируем CMake под iOS Device (без примеров, тестов и сервера)
          cmake -B build-ios-device \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          # 2. Собираем таргети llama и ggml
          cmake --build build-ios-device --config Release --target llama --parallel

          # 3. Находим точные пути к собранным файлам .a
          LLAMA_LIB=$(find build-ios-device -name "libllama.a" | grep "Release-iphoneos" | head -n 1)
          GGML_LIB=$(find build-ios-device -name "libggml.a" | grep "Release-iphoneos" | head -n 1)

          echo "LLAMA_LIB found at: $LLAMA_LIB"
          echo "GGML_LIB found at: $GGML_LIB"

          # 4. Упаковываем библиотеки в xcframework
          mkdir -p build-apple
          xcodebuild -create-xcframework \
            -library "$LLAMA_LIB" \
            -headers include \
            -library "$GGML_LIB" \
            -headers ggml/include \
            -output build-apple/llama.xcframework
    artifacts:
      - llama.cpp/build-apple/llama.xcframework
