scripts:
  - name: Build iOS Device Only
    script: |
      set -e
      cd llama.cpp
      
      # 1. Конфигурация CMake без примеров и тестов
      cmake -B build-ios-device \
        -G Xcode \
        -DCMAKE_SYSTEM_NAME=iOS \
        -DCMAKE_OSX_SYSROOT=iphoneos \
        -DCMAKE_OSX_ARCHITECTURES=arm64 \
        -DCMAKE_SYSTEM_PROCESSOR=arm64 \
        -DGGML_NATIVE=OFF \
        -DBUILD_SHARED_LIBS=OFF \
        -DLLAMA_BUILD_EXAMPLES=OFF \
        -DLLAMA_BUILD_TESTS=OFF \
        -DLLAMA_BUILD_SERVER=OFF

      # 2. Сборка таргета llama (автоматически соберет и ggml)
      cmake --build build-ios-device --config Release --target llama --parallel

      # 3. Находим точные пути к собранным статикам .a
      LLAMA_LIB=$(find build-ios-device -name "libllama.a" | grep "Release-iphoneos" | head -n 1)
      GGML_LIB=$(find build-ios-device -name "libggml.a" | grep "Release-iphoneos" | head -n 1)

      echo "Found LLAMA_LIB: $LLAMA_LIB"
      echo "Found GGML_LIB: $GGML_LIB"

      # 4. Упаковка в XCFramework
      mkdir -p build-apple
      xcodebuild -create-xcframework \
        -library "$LLAMA_LIB" \
        -headers include \
        -library "$GGML_LIB" \
        -headers ggml/include \
        -output build-apple/llama.xcframework
