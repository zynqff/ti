workflows:

  build-xcframework:
    name: Build llama.xcframework (iOS arm64 + Metal)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:

      # =========================================================
      # 1. Checkout llama.cpp with Q2_0c / HY-MT2 2-bit support
      # =========================================================
      - name: Checkout Q2_0c llama.cpp
        script: |
          set -e

          echo "========================================"
          echo "Cloning llama.cpp Q2_0c runtime"
          echo "========================================"

          git clone --branch pr-19357-sme2-int2 --single-branch \
            https://github.com/sjl623/llama.cpp.git llama.cpp

          cd llama.cpp

          echo ""
          echo "llama.cpp commit:"
          git rev-parse HEAD

          echo ""
          echo "llama.cpp branch:"
          git branch --show-current

          echo "========================================"


      # =========================================================
      # 2. Verify Q2_0c support
      # =========================================================
      - name: Verify Q2_0c support
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Checking Q2_0c support"
          echo "========================================"

          if grep -R "Q2_0c" ggml src include 2>/dev/null | head -n 20; then
            echo ""
            echo "Q2_0c references found."
          else
            echo ""
            echo "WARNING: Q2_0c text was not found."
            echo "The build will continue, but this must be checked."
          fi

          echo ""
          echo "Checking ggml type definitions..."

          grep -R "Q2_0c" ggml/include ggml/src 2>/dev/null | head -n 30 || true

          echo "========================================"


      # =========================================================
      # 3. Configure iOS arm64 + Metal
      # =========================================================
      - name: Configure iOS arm64 Metal
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Configuring iOS arm64 + Metal"
          echo "========================================"

          cmake -B build-ios-device \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_BLAS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF

          echo ""
          echo "========================================"
          echo "CMake configuration complete"
          echo "========================================"


      # =========================================================
      # 4. Build llama + ggml + Metal
      # =========================================================
      - name: Build iOS Device
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Building llama.cpp"
          echo "Target: iOS arm64"
          echo "Backend: Metal"
          echo "========================================"

          cmake --build build-ios-device \
            --config Release \
            --target llama \
            --parallel

          echo ""
          echo "========================================"
          echo "Build completed"
          echo "========================================"


      # =========================================================
      # 5. Locate all required static libraries
      # =========================================================
      - name: Locate Libraries
        script: |
          set -e

          cd llama.cpp

          echo "========================================"
          echo "Searching for libraries"
          echo "========================================"

          LLAMA_LIB=$(find build-ios-device \
            -name "libllama.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_LIB=$(find build-ios-device \
            -name "libggml.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_BASE_LIB=$(find build-ios-device \
            -name "libggml-base.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_CPU_LIB=$(find build-ios-device \
            -name "libggml-cpu.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_METAL_LIB=$(find build-ios-device \
            -name "libggml-metal.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          echo "LLAMA_LIB:"
          echo "$LLAMA_LIB"

          echo ""
          echo "GGML_LIB:"
          echo "$GGML_LIB"

          echo ""
          echo "GGML_BASE_LIB:"
          echo "$GGML_BASE_LIB"

          echo ""
          echo "GGML_CPU_LIB:"
          echo "$GGML_CPU_LIB"

          echo ""
          echo "GGML_METAL_LIB:"
          echo "$GGML_METAL_LIB"

          echo ""

          test -n "$LLAMA_LIB" || {
            echo "ERROR: libllama.a not found"
            exit 1
          }

          test -n "$GGML_LIB" || {
            echo "ERROR: libggml.a not found"
            exit 1
          }

          test -n "$GGML_BASE_LIB" || {
            echo "ERROR: libggml-base.a not found"
            exit 1
          }

          test -n "$GGML_CPU_LIB" || {
            echo "ERROR: libggml-cpu.a not found"
            exit 1
          }

          test -n "$GGML_METAL_LIB" || {
            echo "ERROR: libggml-metal.a not found"
            exit 1
          }

          echo "========================================"
          echo "All libraries found"
          echo "========================================"


      # =========================================================
      # 6. Combine static libraries
      # =========================================================
      - name: Combine Static Libraries
        script: |
          set -e

          cd llama.cpp

          mkdir -p build-ios-device/combined

          LLAMA_LIB=$(find build-ios-device \
            -name "libllama.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_LIB=$(find build-ios-device \
            -name "libggml.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_BASE_LIB=$(find build-ios-device \
            -name "libggml-base.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_CPU_LIB=$(find build-ios-device \
            -name "libggml-cpu.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          GGML_METAL_LIB=$(find build-ios-device \
            -name "libggml-metal.a" \
            | grep "Release-iphoneos" \
            | head -n 1)

          echo "========================================"
          echo "Combining static libraries"
          echo "========================================"

          libtool -static \
            -o build-ios-device/combined/libllama_combined.a \
            "$LLAMA_LIB" \
            "$GGML_LIB" \
            "$GGML_BASE_LIB" \
            "$GGML_CPU_LIB" \
            "$GGML_METAL_LIB"

          echo ""
          echo "Combined library:"
          ls -lh build-ios-device/combined/libllama_combined.a

          echo "========================================"


      # =========================================================
      # 7. Prepare public headers
      # =========================================================
      - name: Prepare Headers
        script: |
          set -e

          cd llama.cpp

          rm -rf build-apple/merged-headers
          mkdir -p build-apple/merged-headers

          echo "========================================"
          echo "Preparing headers"
          echo "========================================"

          cp include/*.h \
            build-apple/merged-headers/

          cp ggml/include/*.h \
            build-apple/merged-headers/

          echo "Headers:"
          ls -lah build-apple/merged-headers

          echo "========================================"


      # =========================================================
      # 8. Create module map
      # =========================================================
      - name: Create Module Map
        script: |
          set -e

          cd llama.cpp

          cat > build-apple/merged-headers/module.modulemap <<'EOF'
          module llama {
              header "llama.h"
              export *
          }
          EOF

          echo "========================================"
          echo "module.modulemap"
          echo "========================================"

          cat build-apple/merged-headers/module.modulemap

          echo "========================================"


      # =========================================================
      # 9. Create XCFramework
      # =========================================================
      - name: Create XCFramework
        script: |
          set -e

          cd llama.cpp

          rm -rf build-apple/llama.xcframework
          mkdir -p build-apple

          echo "========================================"
          echo "Creating llama.xcframework"
          echo "========================================"

          xcodebuild -create-xcframework \
            -library build-ios-device/combined/libllama_combined.a \
            -headers build-apple/merged-headers \
            -output build-apple/llama.xcframework

          echo ""
          echo "========================================"
          echo "XCFramework created"
          echo "========================================"

          find build-apple/llama.xcframework -maxdepth 3 -type f | sort

          echo ""
          echo "========================================"
          echo "XCFramework structure"
          echo "========================================"

          ls -lah build-apple/llama.xcframework


      # =========================================================
      # 10. Final verification
      # =========================================================
      - name: Verify XCFramework
        script: |
          set -e

          cd llama.cpp

          FRAMEWORK="build-apple/llama.xcframework/ios-arm64"

          echo "========================================"
          echo "Final verification"
          echo "========================================"

          test -d "$FRAMEWORK" || {
            echo "ERROR: ios-arm64 slice not found"
            exit 1
          }

          test -f "$FRAMEWORK/llama.framework/llama" || {
            echo "ERROR: llama.framework binary not found"
            exit 1
          }

          echo "SUCCESS:"
          echo "  iOS arm64 slice: OK"
          echo "  llama.framework: OK"
          echo "  Metal: enabled during build"
          echo "  Target: iphoneos"
          echo "  Architecture: arm64"

          echo ""
          echo "Binary information:"
          file "$FRAMEWORK/llama.framework/llama"

          echo ""
          echo "========================================"
          echo "READY FOR LocalTranslator"
          echo "========================================"


    artifacts:
      - llama.cpp/build-apple/llama.xcframework
