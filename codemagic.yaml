workflows:
  ios-swift-build:
    name: iOS Application Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --scheme "VibeTalkAudioLab"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - zynqff@gmail.com
        notify:
          success: true
          failure: true
