workflows:
  ios-swift-build:
    name: iOS Application Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Unsigned iOS IPA
        script: |
          set -e

          # 1. Поиск Xcode-проекта
          XCODEPROJECT_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$XCODEPROJECT_PATH")
          XCODEPROJECT=$(basename "$XCODEPROJECT_PATH")

          echo "📁 Проект найден: $XCODEPROJECT в папке $PROJECT_DIR"

          # 2. Исправление путей: скопировать Swift-файлы из подпапок в корень, где их ожидает Xcode
          echo "🔍 Синхронизация файлов исходного кода..."
          find . -mindepth 2 -name "*.swift" -exec cp -f {} . \; 2>/dev/null || true

          # 3. Загрузка зависимостей (если используются)
          xcodebuild -resolvePackageDependencies -project "$XCODEPROJECT" || true

          # 4. Архивация проекта
          xcodebuild archive \
            -project "$XCODEPROJECT" \
            -scheme "VibeTalkAudioLab" \
            -destination 'generic/platform=iOS' \
            -archivePath "./build/VibeTalkAudioLab.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION="5.0" \
            PRODUCT_NAME="VibeTalkAudioLab"

          # 5. Поиск скомпилированного .app
          APP_PATH=$(find ./build/VibeTalkAudioLab.xcarchive -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ Ошибка: Приложение .app не найдено внутри .xcarchive!"
            exit 1
          fi

          echo "✅ Найдено скомпилированное приложение: $APP_PATH"

          # 6. Упаковка в .ipa
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build/ios/ipa
          zip -r build/ios/ipa/VibeTalkAudioLab.ipa Payload

          echo "🎉 Сборка успешно завершена!"
          ls -lh build/ios/ipa/VibeTalkAudioLab.ipa
    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - zynqff@gmail.com
        notify:
          success: true
          failure: true
