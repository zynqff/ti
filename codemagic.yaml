workflows:
  ios-swift-build:
    name: iOS Application Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Unsigned iOS IPA
        script: |
          XCODEPROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          echo "Найден проект: $XCODEPROJECT"

          # 1. Компилируем проект без требования подписи Apple
          xcodebuild build \
            -project "$XCODEPROJECT" \
            -scheme "VibeTalkAudioLab" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

          # 2. Упаковываем собранное приложение в .ipa
          mkdir -p build/ios/ipa Payload
          cp -R build/Release-iphoneos/*.app Payload/
          zip -r build/ios/ipa/VibeTalkAudioLab.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - zynqff@gmail.com
        notify:
          success: true
          failure: true
