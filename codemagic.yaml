workflows:
  ios-unsigned-ipa:
    name: VibeTalk Audio Lab - unsigned IPA (RNNoise + DTLN2 + DFNet3)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify models and prepare RNNoise
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          chmod +x Scripts/prepare_native.sh
          ./Scripts/prepare_native.sh
      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild -resolvePackageDependencies \
            -project VibeTalkAudioLab.xcodeproj \
            -scheme VibeTalkAudioLab
      - name: Build unsigned iOS device app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          rm -rf build_unsigned
          mkdir -p build_unsigned
          xcodebuild \
            -project VibeTalkAudioLab.xcodeproj \
            -scheme VibeTalkAudioLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build_unsigned/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build
      - name: Package unsigned IPA container
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          APP="$CM_BUILD_DIR/build_unsigned/DerivedData/Build/Products/Release-iphoneos/VibeTalkAudioLab.app"
          test -d "$APP"
          rm -rf "$CM_BUILD_DIR/build_unsigned/Payload"
          mkdir -p "$CM_BUILD_DIR/build_unsigned/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build_unsigned/Payload/"
          cd "$CM_BUILD_DIR/build_unsigned"
          /usr/bin/zip -qry VibeTalkAudioLab-unsigned.ipa Payload
      - name: Diagnostics
        script: |
          cd "$CM_BUILD_DIR"
          xcodebuild -version || true
          ls -lh build_unsigned/VibeTalkAudioLab-unsigned.ipa
    artifacts:
      - build_unsigned/VibeTalkAudioLab-unsigned.ipa
      - build_unsigned/DerivedData/Build/Products/Release-iphoneos/VibeTalkAudioLab.app
      - build_unsigned/DerivedData/Build/Products/Release-iphoneos/*.dSYM
      - /tmp/xcodebuild_logs/*.log
